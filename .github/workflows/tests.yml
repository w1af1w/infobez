name: Unit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Запуск unit-тестов
        run: npm test
      - name: Создание папки для базы данных
        run: mkdir -p database