<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2>Вход</h2>
        <form id="loginForm">
            <input
                type="text"
                id="login"
                placeholder="Логин"
                required
            >
            <input
                type="password"
                id="password"
                placeholder="Пароль"
                required
            >
            <button type="submit">Войти</button>
        </form>
        <p>
            Нет аккаунта?
            <a href="regestration.html">Зарегистрироваться</a>
        </p>
    </div>
    <script src="login.js"></script>
</body>
</html>
